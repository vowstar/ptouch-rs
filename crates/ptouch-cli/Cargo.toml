[package]
name = "ptouch-cli"
description = "Command-line tool for Brother P-Touch label printers"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Original CLI source is MIT, but the binary links the GPL ptouch-core crate,
# so the distributed program is GPL-3.0-or-later.
license = "MIT AND GPL-3.0-or-later"
repository.workspace = true

[[bin]]
name = "ptouch"
path = "src/main.rs"

[dependencies]
ptouch-core = { path = "../ptouch-core" }
ptouch-render = { path = "../ptouch-render" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
log = "0.4"
env_logger = "0.11"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
ptouch-core = { path = "../ptouch-core", features = ["bluetooth"] }
