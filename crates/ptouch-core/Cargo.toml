[package]
name = "ptouch-core"
description = "Brother P-Touch printer protocol library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Native macOS RFCOMM support; USB builds keep their existing dependency set.
bluetooth = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-io-bluetooth"]

[dependencies]
# vendored: statically compile libusb from source so release binaries carry no
# external libusb dependency (self-contained .app / AppImage / .exe).
rusb = { version = "0.9", features = ["vendored"] }
thiserror = "2.0"
log = "0.4"
bitflags = { version = "2.6", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Printing", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSDate", "NSRunLoop", "NSObjCRuntime"] }
objc2-io-bluetooth = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothObject", "IOBluetoothDevice", "IOBluetoothRFCOMMChannel", "IOBluetoothSDPUUID", "IOBluetoothSDPServiceRecord"] }
