name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_cli: ptouch
            artifact_gui: ptouch-gui
            asset_suffix: linux-amd64
            target: x86_64-unknown-linux-gnu
            package_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            artifact_cli: ptouch
            artifact_gui: ptouch-gui
            asset_suffix: linux-arm64
            target: aarch64-unknown-linux-gnu
            package_arch: arm64
            rpm_arch: aarch64
          - os: windows-latest
            artifact_cli: ptouch.exe
            artifact_gui: ptouch-gui.exe
            asset_suffix: windows-amd64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            artifact_cli: ptouch.exe
            artifact_gui: ptouch-gui.exe
            asset_suffix: windows-arm64
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            artifact_cli: ptouch
            artifact_gui: ptouch-gui
            asset_suffix: macos-arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev \
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-dev libssl-dev xvfb libgl1-mesa-dri fonts-dejavu-core rpm \
            libegl1 libgl1 libglx-mesa0 libxcursor1 libxi6 libxinerama1 \
            libxrandr2 libxrender1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build
        run: cargo build --release --workspace --locked --verbose --target ${{ matrix.target }}

      - name: Test release candidate
        run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}

      - name: Check tag version
        shell: bash
        run: python scripts/release-assets.py --check-version "$GITHUB_REF_NAME"

      - name: Windows executable smoke tests
        if: runner.os == 'Windows'
        run: |
          cargo build -p ptouch-core --example usbprint_probe --release --locked --target ${{ matrix.target }}
          python scripts/windows-smoke.py --target ${{ matrix.target }} --profile release --probe

      - name: Upload Windows startup diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-diagnostics-${{ matrix.asset_suffix }}
          path: target/${{ matrix.target }}/release/windows-smoke/
          if-no-files-found: ignore

      - name: Upload experimental USBPRINT probe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usbprint-probe-${{ matrix.asset_suffix }}
          path: target/${{ matrix.target }}/release/examples/usbprint_probe.exe
          if-no-files-found: error

      - name: Native Unix executable smoke tests
        if: runner.os != 'Windows'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python3 scripts/unix-smoke.py --target ${{ matrix.target }} --profile release
          else
            python3 scripts/unix-smoke.py --target ${{ matrix.target }} --profile release
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptouch-${{ matrix.asset_suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_cli }}
          if-no-files-found: error

      - name: Upload GUI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptouch-gui-${{ matrix.asset_suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_gui }}
          if-no-files-found: error

      # macOS: assemble a .app bundle (binary + icns + Info.plist) and zip it
      # with ditto so the bundle's structure is preserved.
      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="ptouch-gui.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ptouch-gui" "$app/Contents/MacOS/ptouch-gui"
          chmod +x "$app/Contents/MacOS/ptouch-gui"
          cp data/macos/ptouch-gui.icns "$app/Contents/Resources/ptouch-gui.icns"
          sed "s/__VERSION__/${version}/g" data/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          bluetooth_usage="$(plutil -extract NSBluetoothAlwaysUsageDescription raw -o - "$app/Contents/Info.plist")"
          test -n "$bluetooth_usage"
          ditto -c -k --keepParent "$app" "ptouch-gui-${{ matrix.asset_suffix }}.app.zip"

      - name: Upload macOS .app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptouch-gui-${{ matrix.asset_suffix }}-app
          path: ptouch-gui-${{ matrix.asset_suffix }}.app.zip
          if-no-files-found: error

      # Linux: build .deb and .rpm with nfpm; they install the binaries, the
      # desktop entry, the icon, and the udev rule (postinst reloads udev).
      - name: Package .deb and .rpm
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          RUST_TARGET: ${{ matrix.target }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: bash scripts/package-linux.sh

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptouch-${{ matrix.asset_suffix }}-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Prepare and verify release assets
        run: python3 scripts/release-assets.py --artifacts artifacts --output release

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
