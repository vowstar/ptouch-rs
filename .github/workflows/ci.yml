name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_arch: arm64
            rpm_arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev \
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-dev libssl-dev xvfb libgl1-mesa-dri fonts-dejavu-core rpm \
          libegl1 libgl1 libglx-mesa0 libxcursor1 libxi6 libxinerama1 \
          libxrandr2 libxrender1 libxkbcommon-x11-0 libdbus-1-3

    - name: Cache dependencies
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check platform core and examples
      run: cargo clippy -p ptouch-core --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings

    - name: Build
      run: cargo build --workspace --locked --verbose --target ${{ matrix.target }}

    - name: Save compiled dependencies
      if: steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      run: cargo test --workspace --locked --verbose --target ${{ matrix.target }}

    - name: Test optional Bluetooth feature
      run: |
        cargo test -p ptouch-core --features bluetooth --all-targets --locked --target ${{ matrix.target }}
        cargo test -p ptouch-core --features bluetooth --doc --locked --target ${{ matrix.target }}

    - name: Check macOS Bluetooth permission metadata
      if: runner.os == 'macOS'
      run: |
        plutil -lint data/macos/Info.plist
        bluetooth_usage="$(plutil -extract NSBluetoothAlwaysUsageDescription raw -o - data/macos/Info.plist)"
        test -n "$bluetooth_usage"

    - name: Windows lint
      if: runner.os == 'Windows'
      run: cargo clippy --workspace --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings

    - name: Provision Windows software OpenGL
      if: runner.os == 'Windows'
      run: ./scripts/windows-mesa.ps1 -Target ${{ matrix.target }} -Profile debug

    - name: Windows executable smoke tests
      if: runner.os == 'Windows'
      run: python scripts/windows-smoke.py --target ${{ matrix.target }} --profile debug

    - name: Check packaging scripts
      if: runner.os == 'Linux'
      run: python3 -m unittest discover -s scripts -p 'test_*.py'

    - name: Native Unix executable smoke tests
      if: runner.os != 'Windows'
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a python3 scripts/unix-smoke.py --target ${{ matrix.target }} --profile debug
        else
          python3 scripts/unix-smoke.py --target ${{ matrix.target }} --profile debug
        fi

    - name: Enumerate experimental USBPRINT interfaces
      if: runner.os == 'Windows'
      run: cargo run -p ptouch-core --example usbprint_probe --locked --target ${{ matrix.target }} -- --list

    - name: Build and inspect Linux packages
      if: runner.os == 'Linux'
      env:
        PACKAGE_ARCH: ${{ matrix.package_arch }}
        RPM_ARCH: ${{ matrix.rpm_arch }}
        RUST_TARGET: ${{ matrix.target }}
        BUILD_PROFILE: debug
      run: bash scripts/package-linux.sh
